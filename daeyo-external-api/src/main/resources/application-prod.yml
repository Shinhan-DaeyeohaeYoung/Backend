spring:
  application:
    name: daeyo-service
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

qr:
  scan-url: "http://localhost:5173/scan"     # 스캔 후 프론트 라우트
  ttl-default-seconds: 50                    # 기본 유효시간(초)
  jwt:
    secret:

server:
  port: 8082

app:
  cookie:
    secure: false
    same-site: Lax
    domain: ""

jwt:
  secret: "${JWT_SECRET}"
  access-token-validity-seconds: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:3600}
  refresh-token-validity-seconds: ${JWT_REFRESH_TOKEN_VALIDITY_SECONDS:1209600}

crypto:
  key: "${CRYPTO_KEY_BASE64:ue7iqDtaqodXtcJXhhjPj4f61HIM4MPKBl5K6Tq6suU=}"
